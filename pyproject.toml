[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fng-chatbot"
version = "0.1.0"
description = "A local MCP tool for grounded Fear & Greed market-sentiment reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "fng-chatbot contributors" }]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.27,<2",
]

[project.scripts]
fng-chatbot-mcp = "fng_chatbot.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pyyaml>=6,<7",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
